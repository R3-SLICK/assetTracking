<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181C">
<title>Gear Cage</title>
<style>
  :root{
    --zinc:#E7E7E1; --card:#FBFBF8; --ink:#16181C; --muted:#6C7078; --rule:#D3D3CB;
    --in:#0B6E4F; --out:#A4341F; --repair:#8A5A00; --retired:#4A4E55; --pad:20px;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--zinc);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:56px}
  .wrap{max-width:560px;margin:0 auto}

  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px var(--pad);border-bottom:1px solid var(--rule)}
  .mark{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:inherit;text-decoration:none}
  .who{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
  .who button{font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule);padding:0;cursor:pointer}

  /* signature: the status band */
  .band{background:var(--ink);color:var(--card);padding:0 0 22px}
  .band[data-status="in"]{background:var(--in)}
  .band[data-status="out"]{background:var(--out)}
  .band[data-status="repair"]{background:var(--repair)}
  .band[data-status="retired"]{background:var(--retired)}
  .ticker{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;padding:7px var(--pad);white-space:nowrap;overflow:hidden;border-bottom:1px solid rgba(251,251,248,.25);opacity:.85}
  .band h1{font-weight:800;font-size:clamp(32px,9vw,48px);line-height:1;margin:20px var(--pad) 0;letter-spacing:-.02em}
  .tag{font-family:var(--mono);font-size:13px;letter-spacing:.08em;margin:12px var(--pad) 0;opacity:.9}
  .holding{margin:14px var(--pad) 0;font-size:16px}
  .holding strong{font-weight:700}

  .facts{border-bottom:1px solid var(--rule);margin:0}
  .fact{display:flex;gap:14px;padding:11px var(--pad);border-bottom:1px solid var(--rule)}
  .fact:last-child{border-bottom:0}
  .fact dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:86px;flex:none;padding-top:3px;margin:0}
  .fact dd{margin:0}

  .controls{padding:var(--pad)}
  .btn{display:block;width:100%;min-height:66px;margin-bottom:12px;font-family:var(--sans);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--card);background:var(--ink);border:0;border-radius:2px;cursor:pointer;text-align:center;text-decoration:none}
  .btn[data-kind="out"]{background:var(--out)}
  .btn[data-kind="in"]{background:var(--in)}
  .btn[data-kind="quiet"]{background:none;color:var(--ink);border:1.5px solid var(--ink);min-height:52px;font-size:16px;line-height:49px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5}
  .btn:focus-visible,.who button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  label{display:block;margin:0 0 16px}
  label span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input{width:100%;font:inherit;padding:14px;background:var(--card);border:1.5px solid var(--rule);border-radius:2px;color:var(--ink)}
  .search{padding:var(--pad) var(--pad) 4px}

  .section-title{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 var(--pad);margin:26px 0 10px}
  .log{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .log li{display:flex;gap:12px;padding:10px var(--pad);border-bottom:1px solid var(--rule);font-size:15px}
  .log time{font-family:var(--mono);font-size:12px;color:var(--muted);width:96px;flex:none;padding-top:2px}

  .items{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .items a{display:flex;align-items:center;gap:12px;padding:14px var(--pad);border-bottom:1px solid var(--rule);color:inherit;text-decoration:none}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--in);flex:none}
  .dot[data-status="out"]{background:var(--out)}
  .dot[data-status="repair"]{background:var(--repair)}
  .dot[data-status="retired"]{background:var(--retired)}
  .items .name{flex:1;font-weight:600}
  .items .meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}

  .note{padding:var(--pad);color:var(--muted);font-size:15px}
  .alert{margin:var(--pad);padding:14px;border-left:4px solid var(--out);background:var(--card);font-size:15px}
  .footer{display:flex;flex-wrap:wrap;gap:16px;padding:24px var(--pad);font-family:var(--mono);font-size:12px}
  .footer a,.footer button{color:var(--muted);background:none;border:0;padding:0;font:inherit;text-decoration:underline;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a class="mark" href="./">Asset Tracking Log</a>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ============================================================ the database
   Everything lives in this phone's browser storage. No server, no network. */

const KEY = 'gearcage.v1';
let memory = null; // fallback if storage is blocked

function db(){
  if (memory) return memory;
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch (e) { return (memory = seed()); }
}
function commit(data){
  if (memory) { memory = data; return; }
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { memory = data; }
}
function seed(){
  const start = {
    items: [
      { id:'EQ-001', name:'Zebra 1', category:'Z Scanner', status:'in', holder:'', location:'Dock', notes:'', since:'' },
      { id:'EQ-002', name:'Zebra 2',  category:'Z Scanner',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-003', name:'Zebra 3',  category:'Z Scanner',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-004', name:'Scanner Gun 1',  category:'Symbol Scanner',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-005', name:'Scanner Gun 2',  category:'Symbol Scanner',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-006', name:'Scanner Gun 3',  category:'Symbol Scanner',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-007', name:'Date Printer',  category:'Printer',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-008', name:'Discount Printer',  category:'Printer',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-009', name:'Produce iPad',  category:'iPad',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
      { id:'EQ-0010', name:'Meat iPad',  category:'iPad',      status:'in', holder:'', location:'Dock',    notes:'', since:'' }
    ],
    log: []
  };
  try { if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(start)); } catch (e) {}
  return start;
}

const now = () => new Date().toISOString();
const find = (data, id) => data.items.find(i => i.id.toLowerCase() === String(id).trim().toLowerCase());

function note(data, item, action, person){
  data.log.unshift({ at: now(), id: item.id, name: item.name, action, person: person || '' });
  if (data.log.length > 2000) data.log.length = 2000;
}

/* ================================================================ plumbing */

const app = document.getElementById('app');
const who = document.getElementById('who');
const tagId = new URLSearchParams(location.search).get('id');
let person = get('gearcage.person') || '';

function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WORDS = { in:'In the office', out:'Checked out', repair:'In repair', retired:'Retired' };

function when(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  if (mins < 1440) return Math.round(mins/60) + ' hr ago';
  if (mins < 10080) return Math.round(mins/1440) + ' d ago';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

function showWho(){
  who.innerHTML = person ? 'Signed in as ' + esc(person) + '<br><button type="button" id="switch">switch</button>' : '';
  const b = document.getElementById('switch');
  if (b) b.onclick = () => { person = ''; set('gearcage.person',''); render(); };
}

function hint(text){
  document.querySelectorAll('.hint').forEach(n => n.remove());
  const box = document.createElement('div');
  box.className = 'alert hint';
  box.textContent = text;
  (document.querySelector('.controls') || app).prepend(box);
}

/* =================================================================== views */

function render(){
  showWho();
  const data = db();
  if (!tagId) return renderList(data, '');
  const item = find(data, tagId);
  item ? renderItem(data, item) : renderRegister();
}

function renderItem(data, item){
  const status = item.status || 'in';
  const out = status === 'out';
  const word = WORDS[status] || status;
  const history = data.log.filter(l => l.id === item.id).slice(0, 8);

  app.innerHTML = `
    <section class="band" data-status="${esc(status)}">
      <div class="ticker">${(word.toUpperCase() + ' · ').repeat(8)}</div>
      <h1>${esc(item.name)}</h1>
      <p class="tag">${esc(item.id)}${item.category ? ' · ' + esc(item.category) : ''}</p>
      ${out && item.holder ? `<p class="holding"><strong>${esc(item.holder)}</strong> has it${item.since ? ', since ' + esc(when(item.since)) : ''}</p>` : ''}
    </section>

    <dl class="facts">
      <div class="fact"><dt>Status</dt><dd>${esc(word)}</dd></div>
      ${item.location ? `<div class="fact"><dt>Kept at</dt><dd>${esc(item.location)}</dd></div>` : ''}
      ${item.notes ? `<div class="fact"><dt>Notes</dt><dd>${esc(item.notes)}</dd></div>` : ''}
    </dl>

    <div class="controls">
      ${person ? '' : `<label><span>Your name</span><input id="name" autocomplete="name" placeholder="e.g. Sam Ortiz"></label>`}
      ${out ? `<button class="btn" data-kind="in" id="act">Check in</button>`
            : `<button class="btn" data-kind="out" id="act">Check out</button>`}
      <button class="btn" data-kind="quiet" id="repair">${status === 'repair' ? 'Back in service' : 'Mark for repair'}</button>
      <a class="btn" data-kind="quiet" href="./">All equipment</a>
    </div>

    ${history.length ? `
      <p class="section-title">Recent activity</p>
      <ul class="log">${history.map(h => `
        <li><time>${esc(when(h.at))}</time><span>${esc(h.action)}${h.person ? ' — ' + esc(h.person) : ''}</span></li>`).join('')}
      </ul>` : ''}`;

  document.getElementById('act').onclick = () => {
    const input = document.getElementById('name');
    const name = person || (input ? input.value.trim() : '');
    if (!name) { hint('Add your name first, then tap again.'); if (input) input.focus(); return; }
    person = name; set('gearcage.person', name); showWho();

    if (out) {
      item.status = 'in'; item.holder = ''; item.since = now();
      note(data, item, 'Check in', name);
    } else {
      item.status = 'out'; item.holder = name; item.since = now();
      note(data, item, 'Check out', name);
    }
    commit(data);
    renderItem(data, item);
  };

  document.getElementById('repair').onclick = () => {
    item.status = status === 'repair' ? 'in' : 'repair';
    item.holder = '';
    item.since = now();
    note(data, item, status === 'repair' ? 'Back in service' : 'Marked for repair', person);
    commit(data);
    renderItem(data, item);
  };
}

function renderRegister(){
  app.innerHTML = `
    <section class="band">
      <div class="ticker">${('NEW TAG · ').repeat(8)}</div>
      <h1>Unregistered tag</h1>
      <p class="tag">${esc(tagId)}</p>
    </section>
    <div class="controls">
      <label><span>What is it?</span><input id="rname" placeholder="e.g. Impact driver"></label>
      <label><span>Category</span><input id="rcat" placeholder="e.g. Power tools"></label>
      <label><span>Kept at</span><input id="rloc" placeholder="e.g. Shelf B"></label>
      <button class="btn" id="reg">Add to the cage</button>
    </div>`;

  document.getElementById('reg').onclick = () => {
    const name = document.getElementById('rname').value.trim();
    if (!name) { hint('Give it a name first.'); return; }
    const data = db();
    const item = {
      id: tagId.trim(), name,
      category: document.getElementById('rcat').value.trim(),
      status: 'in', holder: '',
      location: document.getElementById('rloc').value.trim(),
      notes: '', since: ''
    };
    data.items.push(item);
    note(data, item, 'Registered', person);
    commit(data);
    renderItem(data, item);
  };
}

function renderList(data, term){
  const t = term.toLowerCase();
  const items = data.items
    .filter(i => !t || [i.id, i.name, i.category, i.holder, i.location].join(' ').toLowerCase().includes(t))
    .sort((a, b) => a.name.localeCompare(b.name));
  const out = data.items.filter(i => i.status === 'out').length;
  const feed = data.log.slice(0, 10);

  app.innerHTML = `
    <section class="band" data-status="${out ? 'out' : 'in'}">
      <div class="ticker">${((out ? out + ' OUT' : 'ALL IN') + ' · ').repeat(8)}</div>
      <h1>${out ? out + ' of ' + data.items.length + '<br>signed out' : 'Everything<br>is in'}</h1>
      <p class="tag">${data.items.length} tagged item${data.items.length === 1 ? '' : 's'}</p>
    </section>

    <div class="search"><label><span>Find</span><input id="q" placeholder="name, tag, person, shelf" value="${esc(term)}"></label></div>
    ${'NDEFReader' in window ? '<div class="controls"><button class="btn" data-kind="quiet" id="scan">Scan a tag</button></div>' : ''}

    <p class="section-title">${term ? 'Matches' : 'Everything'}</p>
    <ul class="items">${items.map(i => `
      <li><a href="?id=${encodeURIComponent(i.id)}">
        <span class="dot" data-status="${esc(i.status)}"></span>
        <span class="name">${esc(i.name)}</span>
        <span class="meta">${i.status === 'out' ? esc(i.holder || 'out') : esc(i.id)}</span>
      </a></li>`).join('') || '<li><p class="note">Nothing here yet. Tap a tag to add the first item.</p></li>'}
    </ul>

    ${feed.length && !term ? `
      <p class="section-title">Latest</p>
      <ul class="log">${feed.map(h => `
        <li><time>${esc(when(h.at))}</time><span>${esc(h.name)} — ${esc(h.action.toLowerCase())}${h.person ? ' by ' + esc(h.person) : ''}</span></li>`).join('')}
      </ul>` : ''}

    <p class="footer">
      <button id="csv">Save a backup</button>
      <button id="restore">Restore a backup</button>
    </p>`;

  const box = document.getElementById('q');
  box.oninput = () => {
    const at = box.selectionStart;
    renderList(data, box.value);
    const next = document.getElementById('q');
    next.focus();
    next.setSelectionRange(at, at);
  };

  document.getElementById('csv').onclick = () => backup(data);
  document.getElementById('restore').onclick = restore;

  const scan = document.getElementById('scan');
  if (scan) scan.onclick = async () => {
    scan.textContent = 'Hold your phone to a tag…';
    try {
      const reader = new NDEFReader();
      await reader.scan();
      reader.onreading = ({ message }) => {
        for (const rec of message.records) {
          if (rec.recordType === 'url' || rec.recordType === 'text') {
            const value = new TextDecoder().decode(rec.data);
            const id = value.includes('id=') ? new URL(value, location.href).searchParams.get('id') : value;
            if (id) { location.search = '?id=' + encodeURIComponent(id); return; }
          }
        }
        scan.textContent = 'Nothing readable on that tag.';
      };
    } catch (e) { scan.textContent = 'Scanning is not available here.'; }
  };
}

/* ================================================================= backups */

function backup(data){
  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gear-cage-${stamp}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function restore(){
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = 'application/json,.json';
  picker.onchange = () => {
    const file = picker.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.items)) throw new Error('bad shape');
        commit({ items: data.items, log: Array.isArray(data.log) ? data.log : [] });
        render();
      } catch (e) {
        hint("That file isn't a Gear Cage backup.");
      }
    };
    reader.readAsText(file);
  };
  picker.click();
}

/* Keep working with no signal at all. */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
</body>
</html>
